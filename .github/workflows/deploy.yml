name: Deploy to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking=no" >> ~/.ssh/config

      - name: Deploy repo to EC2
        run: |
          # Remove existing content in my-react-app except .ssh
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo rm -rf /var/www/my-react-app/*
          EOF

          # Copy all repo content except .github to my-react-app
          rsync -av --exclude='.github' ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/my-react-app/

          # Restart Nginx
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo systemctl restart nginx
          EOF
