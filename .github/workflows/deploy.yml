name: Deploy to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking=no" >> ~/.ssh/config

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /var/www/my-react-app-temp || mkdir -p /var/www/my-react-app-temp
            rm -rf /var/www/my-react-app-temp/*
            exit
          EOF

          scp -r * ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/my-react-app-temp/

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /var/www/my-react-app-temp
            npm install
            npm run build

            sudo rm -rf /var/www/my-react-app/*
            sudo cp -r build/* /var/www/my-react-app/

            sudo systemctl restart nginx
          EOF
